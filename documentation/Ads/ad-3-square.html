<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foood Ad 3 - Square</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .ad-container {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #F05000 0%, #F7AA00 100%);
            border-radius: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .badge {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 40px;
        }
        
        h1 {
            color: white;
            font-size: 72px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 30px;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 28px;
            line-height: 1.5;
            margin-bottom: 50px;
            max-width: 700px;
        }
        
        .features {
            display: flex;
            gap: 50px;
            margin-bottom: 50px;
        }
        
        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        
        .feature-icon {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        
        .feature-text {
            color: white;
            font-size: 18px;
            font-weight: 500;
        }
        
        .cta {
            background: white;
            color: #F05000;
            padding: 24px 60px;
            border-radius: 16px;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        
        .url {
            color: rgba(255,255,255,0.8);
            font-size: 22px;
            font-weight: 500;
        }
        
        .decoration {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
        }
        
        .d1 { width: 300px; height: 300px; top: -100px; right: -100px; }
        .d2 { width: 200px; height: 200px; bottom: -50px; left: -50px; }
        .d3 { width: 100px; height: 100px; top: 40%; left: 5%; }
        .d4 { width: 150px; height: 150px; bottom: 20%; right: 5%; }
    </style>
</head>
<body>
    <div class="ad-container">
        <div class="decoration d1"></div>
        <div class="decoration d2"></div>
        <div class="decoration d3"></div>
        <div class="decoration d4"></div>
        
        <div class="badge">✨ 100% Free Forever</div>
        
        <h1>Never wonder<br>"What's for dinner?"</h1>
        
        <p class="subtitle">Plan your meals. Get a shopping list.<br>Stop wasting food and money.</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">📝</div>
                <span class="feature-text">Save Recipes</span>
            </div>
            <div class="feature">
                <div class="feature-icon">📅</div>
                <span class="feature-text">Plan Week</span>
            </div>
            <div class="feature">
                <div class="feature-icon">🛒</div>
                <span class="feature-text">Shop Smart</span>
            </div>
        </div>
        
        <div class="cta">Start Free</div>
        <div class="url">foood.it.com</div>
    </div>
</body>
</html>
